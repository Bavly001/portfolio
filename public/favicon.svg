<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <style>
      @font-face {
        font-family: 'Syne';
        font-style: normal;
        font-weight: 800 900;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      .bg { fill: #070a13; }
      .border { fill: none; stroke: rgba(255, 255, 255, 0.12); stroke-width: 2.5; }
      .monogram {
        font-family: 'Syne', sans-serif;
        font-weight: 900;
        font-size: 58px;
        letter-spacing: 2px;
        fill: #06b6d4;
      }
      .dot {
        fill: #22d3ee;
        filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.8));
      }
    </style>
  </defs>
  <!-- Background Obsidian Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="36" class="bg"/>
  <rect x="4" y="4" width="120" height="120" rx="36" class="border"/>

  <!-- "BA" In Exact Syne Black Typography -->
  <text x="18" y="82" class="monogram">BA</text>

  <!-- Glowing Cyan Beacon -->
  <circle cx="104" cy="74" r="6" class="dot"/>
</svg>
